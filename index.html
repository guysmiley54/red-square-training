<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Square Staff Training</title>
<style>
:root{--paper:#fbfaf7;--card:#fff;--ink:#151515;--muted:#5d5b57;--red:#c8201f}
@media (prefers-color-scheme:dark){:root{--paper:#141312;--card:#1e1d1b;--ink:#f3f1ec;--muted:#a9a59d;--red:#ff5a52;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:20px}
header{border-bottom:3px solid var(--ink);padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.sq{width:14px;height:14px;background:var(--red)}
h1{font-size:30px;line-height:1.1;margin:4px 0 0;font-weight:900}
a.test{display:block;background:var(--card);border:2px solid var(--ink);padding:14px;color:inherit;text-decoration:none}
a.test:hover,a.test:focus-visible{box-shadow:4px 4px 0 var(--ink);outline:none}
a.test b{display:block;font-size:17px}
a.test span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="sq"></span>Red Square Cafe</div>
    <h1>Staff Training</h1>
  </header>
  <a class="test" href="glenorchy-menu.html"><b>Glenorchy Menu Test</b><span>Dishes, ingredients, add-ons, pricing policy, dietary and drinks</span></a>
</div>
</body>
</html>
